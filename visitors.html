<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICGC Management - Visitor Records</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }

        :root {
            --primary-green: #2e7d32;
            --dark-green: #1b5e20;
            --light-green: #e8f5e9;
            --white: #ffffff;
            --text-grey: #555;
            --bg: #f4f7f6;
            --card-bg: #fff;
            --border: #eee;
            --text: #333;
        }

        [data-theme="dark"] {
            --bg: #1a1a1a;
            --card-bg: #2a2a2a;
            --border: #444;
            --text: #eee;
            --text-grey: #aaa;
        }

        body {
            display: flex;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 260px;
            background: var(--dark-green);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: fixed;
            height: 100vh;
            left: -260px;
            transition: 0.3s ease;
            z-index: 2000;
            box-shadow: 5px 0 15px rgba(0,0,0,0.2);
        }
        .sidebar.active { left: 0; }
        .sidebar-logo { text-align:center; margin-bottom:30px; padding-bottom:20px; border-bottom:1px solid rgba(255,255,255,0.1); }
        .sidebar-logo img { width:70px; margin-bottom:10px; }
        .nav-menu { list-style:none; flex:1; }
        .nav-item {
            padding:13px 15px; margin-bottom:5px; border-radius:8px;
            cursor:pointer; transition:0.3s; display:flex;
            align-items:center; gap:10px; font-weight:500;
        }
        .nav-item:hover, .nav-item.active { background:var(--primary-green); }
        .nav-item a { text-decoration:none; color:inherit; }

        /* ── Top Bar ── */
        .top-bar {
            position: fixed; top:0; left:0; right:0; height:56px;
            background:var(--card-bg); border-bottom:1px solid var(--border);
            display:flex; align-items:center; padding:0 16px;
            z-index:1000; gap:12px; box-shadow:0 2px 6px rgba(0,0,0,0.06);
        }
        .menu-btn {
            background:var(--dark-green); color:white; border:none;
            padding:8px 14px; border-radius:6px; cursor:pointer;
            font-weight:bold; font-size:0.88rem;
        }
        .top-title {
            font-weight:700; color:var(--dark-green); font-size:1rem; flex:1;
        }
        .back-btn {
            background:var(--dark-green); color:white; border:none;
            padding:8px 16px; border-radius:8px; font-weight:700;
            font-size:0.85rem; cursor:pointer; white-space:nowrap;
            box-shadow:0 2px 6px rgba(0,0,0,0.15);
        }

        /* ── Overlay ── */
        #overlay {
            display:none; position:fixed; top:0; left:0;
            width:100%; height:100%;
            background:rgba(0,0,0,0.4); z-index:1500;
        }
        #overlay.active { display:block; }

        /* ── Main Content ── */
        .main-content {
            flex:1; width:100%;
            padding: 72px 20px 30px;
            max-width: 700px;
            margin: 0 auto;
        }

        /* ── Stats Row ── */
        .stats-row {
            display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;
        }
        .stat-pill {
            background:var(--card-bg); border-radius:10px;
            padding:12px 18px; border-left:4px solid #e65100;
            box-shadow:0 2px 6px rgba(0,0,0,0.05);
            font-size:0.85rem; color:var(--text-grey);
            display:flex; align-items:center; gap:8px;
        }
        .stat-pill strong { font-size:1.2rem; color:#e65100; }

        /* ── Search ── */
        .search-bar {
            background:var(--card-bg); border:1.5px solid var(--border);
            border-radius:10px; padding:10px 14px; width:100%;
            font-size:0.9rem; color:var(--text); outline:none;
            margin-bottom:16px; transition:border-color 0.2s;
        }
        .search-bar:focus { border-color:var(--primary-green); }

        /* ── Visitor Card ── */
        .visitor-card {
            background:var(--card-bg);
            border-radius:12px;
            margin-bottom:12px;
            border-left:5px solid #e65100;
            box-shadow:0 2px 8px rgba(0,0,0,0.06);
            overflow:hidden;
            transition:box-shadow 0.2s;
        }
        .visitor-card:hover { box-shadow:0 4px 14px rgba(0,0,0,0.1); }

        .card-header {
            display:flex; justify-content:space-between;
            align-items:center; gap:10px;
            padding:16px 18px; cursor:pointer;
        }
        .card-header:active { background:var(--light-green); }

        .card-name { font-weight:800; color:var(--dark-green); font-size:1rem; }
        .card-sub  { font-size:0.78rem; color:#aaa; margin-top:2px; }
        .card-caret { color:#aaa; font-size:1.1rem; transition:transform 0.25s; flex-shrink:0; }
        .card-caret.open { transform:rotate(180deg); }

        .card-body {
            display:none; padding:0 18px 18px;
            border-top:1px solid var(--border);
        }
        .card-body.open { display:block; }

        .card-id { font-size:0.72rem; color:#bbb; padding:8px 0 10px; }

        .detail-row {
            padding:7px 0;
            border-bottom:1px solid var(--border);
        }
        .detail-row:last-of-type { border-bottom:none; }
        .detail-label {
            font-size:0.7rem; font-weight:700;
            color:var(--primary-green); text-transform:uppercase;
            letter-spacing:0.3px; margin-bottom:2px;
        }
        .detail-value { font-size:0.9rem; color:var(--text); }

        .promote-btn {
            width:100%; margin-top:14px;
            background:var(--primary-green); color:white;
            border:none; padding:12px; border-radius:8px;
            font-weight:700; font-size:0.9rem; cursor:pointer;
            transition:background 0.2s;
        }
        .promote-btn:hover { background:var(--dark-green); }

        /* ── Empty state ── */
        .empty {
            text-align:center; padding:60px 20px;
            color:#999;
        }
        .empty-icon { font-size:3rem; margin-bottom:12px; }
        .empty-title { font-weight:700; font-size:1rem; margin-bottom:6px; }
        .empty-sub { font-size:0.85rem; }

        /* ── Toast ── */
        #toast {
            position:fixed; bottom:24px; left:50%;
            transform:translateX(-50%);
            background:#1b5e20; color:white;
            padding:12px 22px; border-radius:8px;
            font-weight:700; font-size:0.88rem;
            z-index:9000; display:none;
            box-shadow:0 4px 15px rgba(0,0,0,0.2);
            white-space:nowrap;
            transition:opacity 0.3s;
        }
        #toast.show { display:block; }

        /* ── Logout Modal ── */
        .modal-backdrop {
            display:none; position:fixed; top:0; left:0;
            width:100%; height:100%; background:rgba(0,0,0,0.5);
            z-index:9000; justify-content:center; align-items:center;
        }
        .modal-backdrop.active { display:flex; }
        .modal {
            background:#fff; padding:28px; border-radius:12px;
            width:320px; max-width:95%; text-align:center;
            box-shadow:0 10px 40px rgba(0,0,0,0.2);
        }
        .modal h2 { color:#1b5e20; margin-bottom:10px; font-size:1.1rem; }
        .modal p  { color:#666; font-size:0.9rem; margin-bottom:20px; }
        .modal-actions { display:flex; gap:10px; }
        .btn-confirm { flex:1; background:#c62828; color:white; border:none; padding:11px; border-radius:8px; font-weight:bold; cursor:pointer; }
        .btn-cancel  { flex:1; background:#eee; color:#555; border:none; padding:11px; border-radius:8px; font-weight:bold; cursor:pointer; }

        @media (max-width:480px) {
            .main-content { padding:68px 12px 24px; }
            .stats-row { gap:8px; }
            .stat-pill { padding:10px 14px; }
        }
    </style>
</head>
<body>

<!-- Session Guard -->
<script>
(function() {
    try {
        const s = localStorage.getItem('icgc_session');
        if (!s) { window.location.replace('l1.html'); return; }
        const parsed = JSON.parse(s);
        if (!parsed || parsed.expires_at < Date.now()) {
            localStorage.removeItem('icgc_session');
            window.location.replace('l1.html');
        }
    } catch(e) {
        localStorage.removeItem('icgc_session');
        window.location.replace('l1.html');
    }
})();
</script>

<div id="overlay" onclick="toggleSidebar()"></div>

<!-- Top Bar -->
<div class="top-bar">
    <button class="menu-btn" onclick="toggleSidebar()">☰ MENU</button>
    <span class="top-title">🙋 Visitor Records</span>
    <button class="back-btn" onclick="window.location.href='member management.html'">← Members</button>
</div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <img src="ICGCNCT.PNG" alt="Logo">
        <h3 id="sidebarName">ICGC Admin</h3>
        <div style="font-size:0.72rem;color:rgba(255,255,255,0.6);margin-top:3px;" id="sidebarBranch"></div>
    </div>
    <ul class="nav-menu">
        <a href="h2.html"                    style="text-decoration:none;color:inherit;"><li class="nav-item">🏠 Home</li></a>
        <a href="member management.html"     style="text-decoration:none;color:inherit;"><li class="nav-item">👥 Members</li></a>
        <a href="f2.html"                    style="text-decoration:none;color:inherit;"><li class="nav-item">💰 Finance</li></a>
        <a href="inventory.html"             style="text-decoration:none;color:inherit;"><li class="nav-item">📦 Inventory</li></a>
        <a href="attendance.html"            style="text-decoration:none;color:inherit;"><li class="nav-item">✅ Attendance</li></a>
        <a href="scanner.html"               style="text-decoration:none;color:inherit;"><li class="nav-item">📷 QR Scanner</li></a>
        <li class="nav-item" onclick="confirmLogout()"
            style="background:#c62828;color:white;margin-top:14px;text-align:center;justify-content:center;">
            🔒 Logout
        </li>
    </ul>
</div>

<!-- Main Content -->
<div class="main-content">

    <!-- Stats -->
    <div class="stats-row">
        <div class="stat-pill">🙋 Total Visitors: <strong id="statTotal">—</strong></div>
        <div class="stat-pill" style="border-left-color:#2e7d32;">✅ Promoted: <strong id="statPromoted" style="color:#2e7d32;">—</strong></div>
    </div>

    <!-- Search -->
    <input type="text" class="search-bar" placeholder="🔍 Search visitors by name or phone..."
        oninput="filterVisitors(this.value)">

    <!-- Visitor List -->
    <div id="visitorRecordsList"></div>

</div>

<!-- Logout Modal -->
<div class="modal-backdrop" id="logoutModal">
    <div class="modal">
        <h2>🔒 Log Out</h2>
        <p>Are you sure you want to log out of the system?</p>
        <div class="modal-actions">
            <button class="btn-confirm" onclick="doLogout()">Yes, Logout</button>
            <button class="btn-cancel"  onclick="closeLogoutModal()">Cancel</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
    const SUPABASE_URL = 'https://negrfzkejqfmswxnfiyk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5lZ3JmemtlanFmbXN3eG5maXlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzODY5NjUsImV4cCI6MjA5NDk2Mjk2NX0.wC3qC7l5PRIKd0o8p0oSphKX9q8QtzJjDwYfJg-duZ8';

    async function sbFetch(path, method='GET', body=null, extra='') {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}${extra}`, {
            method,
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': method==='POST' ? 'return=representation' : ''
            },
            body: body ? JSON.stringify(body) : null
        });
        if (!res.ok) { const e = await res.text(); throw new Error(e); }
        const t = await res.text(); return t ? JSON.parse(t) : [];
    }

    async function getMembers() { return await sbFetch('members?order=created_at.asc'); }

    async function updateMemberInDB(m) {
        return await sbFetch(`members?id=eq.${encodeURIComponent(m.id)}`, 'PATCH', {
            name:m.name, phone:m.phone||'—', dept:m.dept||'',
            gender:m.gender||'', dob:m.dob||'', status:m.status||'active'
        });
    }

    // ── Sidebar ───────────────────────────────────────────
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    // ── Render visitors ───────────────────────────────────
    let allVisitors = [];

    async function loadVisitors() {
        const el = document.getElementById('visitorRecordsList');
        el.innerHTML = `<div style="text-align:center;padding:40px;color:#aaa;">⏳ Loading visitors...</div>`;
        try {
            const members = await getMembers();
            allVisitors   = members.filter(m => m.status === 'visitor');
            const promoted = members.filter(m => m.status === 'active' && m.id.startsWith('ICGC-V')).length;

            document.getElementById('statTotal').textContent    = allVisitors.length;
            document.getElementById('statPromoted').textContent = promoted || 0;

            renderVisitors(allVisitors);
        } catch(err) {
            el.innerHTML = `<div style="text-align:center;padding:40px;color:#c62828;">❌ ${err.message}</div>`;
        }
    }

    function renderVisitors(visitors) {
        const el = document.getElementById('visitorRecordsList');
        if (!visitors.length) {
            el.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">🙋</div>
                    <div class="empty-title">No visitor records yet</div>
                    <div class="empty-sub">Visitors who scan the church QR code and fill the<br>"Let's Get Acquainted" form will appear here.</div>
                </div>`;
            return;
        }

        const gIcon = { male:'👨', female:'👩', child:'🧒' };

        el.innerHTML = visitors.map(v => {
            const details = [
                v.phone      ? { label:'📞 Phone',       value: v.phone }      : null,
                v.whatsapp   ? { label:'💬 WhatsApp',    value: v.whatsapp }   : null,
                v.gender     ? { label:'⚧ Gender',       value: `${gIcon[v.gender]||''} ${v.gender}` } : null,
                v.age_group  ? { label:'🎂 Age Group',   value: v.age_group }  : null,
                v.occupation ? { label:'💼 Occupation',  value: v.occupation } : null,
                v.address    ? { label:'🏠 Address',     value: v.address }    : null,
                v.location   ? { label:'📍 Location',    value: v.location }   : null,
                v.reason     ? { label:'🙏 Reason',      value: v.reason }     : null,
                v.visit_date ? { label:'📅 Visit Date',  value: v.visit_date } : null,
            ].filter(Boolean);

            const detailsHTML = details.length
                ? details.map(d => `
                    <div class="detail-row">
                        <div class="detail-label">${d.label}</div>
                        <div class="detail-value">${d.value}</div>
                    </div>`).join('')
                : `<div class="detail-row" style="color:#aaa;font-size:0.85rem;">No additional details on file.</div>`;

            return `
            <div class="visitor-card" id="vcard-${v.id}">
                <div class="card-header" onclick="toggleCard('${v.id}')">
                    <div style="flex:1;min-width:0;">
                        <div class="card-name">${v.name}</div>
                        <div class="card-sub">${v.phone||'No phone'} &middot; ${v.visit_date||'Visitor'}</div>
                    </div>
                    <span class="card-caret" id="caret-${v.id}">▾</span>
                </div>
                <div class="card-body" id="body-${v.id}">
                    <div class="card-id">ID: ${v.id}</div>
                    ${detailsHTML}
                    <button class="promote-btn" onclick="promoteToMember('${v.id}')">
                        ➕ Add as Active Member
                    </button>
                </div>
            </div>`;
        }).join('');
    }

    function toggleCard(id) {
        const body  = document.getElementById(`body-${id}`);
        const caret = document.getElementById(`caret-${id}`);
        const open  = body.classList.toggle('open');
        caret.classList.toggle('open', open);
    }

    function filterVisitors(query) {
        const q = query.toLowerCase();
        const filtered = allVisitors.filter(v =>
            v.name.toLowerCase().includes(q) ||
            (v.phone||'').toLowerCase().includes(q)
        );
        renderVisitors(filtered);
    }

    async function promoteToMember(visitorId) {
        const v = allVisitors.find(x => x.id === visitorId);
        if (!v) return;

        // Inline confirmation inside the card instead of alert
        const btn = document.querySelector(`#vcard-${visitorId} .promote-btn`);
        if (btn) {
            btn.textContent = '⏳ Promoting...';
            btn.disabled = true;
        }
        try {
            await updateMemberInDB({ ...v, status: 'active', dept: v.dept||'General' });
            showToast(`✅ ${v.name} added as Active Member!`);
            await loadVisitors();
        } catch(err) {
            showToast('❌ Error: ' + err.message, true);
            if (btn) { btn.textContent = '➕ Add as Active Member'; btn.disabled = false; }
        }
    }

    // ── Theme ─────────────────────────────────────────────
    function applyTheme() {
        const t = localStorage.getItem('icgc_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
    }

    // ── Settings ──────────────────────────────────────────
    function applySettings() {
        const s  = JSON.parse(localStorage.getItem('icgc_settings') || '{}');
        const sn = document.getElementById('sidebarName');
        const bn = document.getElementById('sidebarBranch');
        const session = localStorage.getItem('icgc_session');
        if (session) {
            try {
                const sess = JSON.parse(session);
                if (sn && sess.user?.name) sn.textContent = sess.user.name;
                if (bn) bn.textContent = sess.user?.role === 'superadmin' ? '👑 Super Admin' : '👤 Staff';
            } catch(e) {}
        }
        if (bn && s.churchName) bn.textContent = s.churchName;
    }

    // ── Toast ─────────────────────────────────────────────
    function showToast(msg, isError=false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = isError ? '#c62828' : '#1b5e20';
        toast.classList.remove('show');
        void toast.offsetWidth;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3200);
    }

    // ── Logout ────────────────────────────────────────────
    function confirmLogout()    { document.getElementById('logoutModal').classList.add('active'); }
    function closeLogoutModal() { document.getElementById('logoutModal').classList.remove('active'); }
    async function doLogout() {
        try {
            const session = localStorage.getItem('icgc_session');
            if (session) {
                const s = JSON.parse(session);
                if (s.access_token) {
                    await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
                        method:'POST',
                        headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${s.access_token}`}
                    });
                }
            }
        } catch(e) {}
        localStorage.removeItem('icgc_session');
        window.location.href = 'l1.html';
    }

    // ── Init ──────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
        applyTheme();
        applySettings();
        loadVisitors();
    });
</script>
</body>
</html>
